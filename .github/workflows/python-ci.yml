name: Python Data Logger Check

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install glob2 
        
    - name: Create Mock Device(s) in a temporary directory
      run: |
        mkdir -p ./mock_devices/28-00000000000a
        echo "75 01 4b 46 7f ff 0d 10 52 : crc=52 YES" > ./mock_devices/28-00000000000a/w1_slave
        echo "75 01 4b 46 7f ff 0d 10 52 t=23125" >> ./mock_devices/28-00000000000a/w1_slave
 
    - name: Validate imports
      run: |
        python -c "import os, glob, time, datetime, csv"
        python -c "from scripts.tempsensor import read_temp, write_to_csv"
        
    - name: Modify script to use mock devices
      run: |
        sed -i 's/\/sys\/bus\/w1\/devices/.\/mock_devices/g' scripts/tempsensor.py
    
    - name: Test read_temp
      run: |
        python -c "import scripts.tempsensor; print(scripts.tempsensor.read_temp())"

#    - name: Prevent infinite Loop
